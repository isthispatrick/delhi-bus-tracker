<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Delhi Bus" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Delhi Bus · Live</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map" aria-label="Map of live buses"></div>

  <!-- first paint -->
  <div id="boot">
    <div class="boot-mark"><svg viewBox="0 0 24 24" width="30" height="30"><use href="#i-bus"/></svg></div>
    <div class="boot-title">Delhi Bus</div>
    <div class="boot-sub" id="boot-sub">Finding live buses…</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <!-- app bar -->
  <header id="appbar">
    <div id="searchbox" role="search">
      <button id="search-back" class="sb-icon hidden" aria-label="Back"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <span id="search-lead" class="sb-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></span>
      <input id="q" type="search" enterkeyhint="search" placeholder="Where to? Place or route no." autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search places or bus routes" />
      <button id="q-clear" class="sb-icon hidden" aria-label="Clear search"><svg viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
    </div>
    <div id="suggest" class="hidden" role="listbox"></div>
    <div id="chips">
      <button class="chip" id="chip-near"><svg viewBox="0 0 24 24"><use href="#i-stop"/></svg>Near me</button>
      <span id="saved-chips"></span>
      <button class="chip chip-install hidden" id="chip-install"><svg viewBox="0 0 24 24"><use href="#i-install"/></svg>Install app</button>
      <button class="chip chip-focus hidden" id="chip-focus"><span id="chip-focus-label"></span><svg viewBox="0 0 24 24" class="x"><use href="#i-x"/></svg></button>
    </div>
    <div id="banner" class="hidden" role="status"></div>
    <div id="alertbar" class="hidden" role="alert"></div>
  </header>

  <!-- floating controls (thumb zone) -->
  <div id="fabs">
    <button id="btn-3d" class="fab" aria-pressed="false" aria-label="Toggle 3D view"><span>3D</span></button>
    <button id="btn-locate" class="fab" aria-label="Show my location"><svg viewBox="0 0 24 24"><use href="#i-locate"/></svg></button>
  </div>

  <div id="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="status-text">Connecting…</span>
  </div>

  <!-- bottom sheet -->
  <section id="sheet" aria-hidden="true">
    <div id="sheet-grab"><div class="grabber"></div></div>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="fatal" class="hidden"></div>

  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><path d="M20.5 3.5 3.8 10.6c-.6.3-.5 1.1.1 1.3l6.6 1.6 1.6 6.6c.2.6 1 .7 1.3.1l7.1-16.7z" fill="currentColor"/></symbol>
      <symbol id="i-bus" viewBox="0 0 24 24"><path d="M6 3h12a3 3 0 0 1 3 3v10.5a1.5 1.5 0 0 1-1.5 1.5H19v1.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V18H8v1.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V18h-.5A1.5 1.5 0 0 1 3 16.5V6a3 3 0 0 1 3-3zm-.5 4v5h13V7zm1.5 7.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm10 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z" fill="currentColor"/></symbol>
      <symbol id="i-metro" viewBox="0 0 24 24"><path d="M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-2.2 2.9l1.9 2.6a.7.7 0 0 1-.6 1.1h-1.3a.8.8 0 0 1-.6-.3L15.3 18H8.7l-1.9 3.3a.8.8 0 0 1-.6.3H4.9a.7.7 0 0 1-.6-1.1l1.9-2.6A3 3 0 0 1 4 15V6a3 3 0 0 1 3-3zm-.5 3.5v4h11v-4zm1.5 6.5a1.2 1.2 0 1 0 0 2.4A1.2 1.2 0 0 0 8 13zm8 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z" fill="currentColor"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2" fill="currentColor"/><path d="M9.5 21l2-6.5 2.5 2.5V21M8 11.5l2.5-3.5h3l2 3.5 2.5 1M11.5 8l-1 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 14v7M8 7.5h8M8 10.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#0b0f14"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-follow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-place" viewBox="0 0 24 24"><path d="M12 21s6-5.4 6-10.5a6 6 0 1 0-12 0C6 15.6 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10.5" r="2" fill="currentColor"/></symbol>
      <symbol id="i-live" viewBox="0 0 24 24"><path d="M5 9a10 10 0 0 1 14 0M8 12.2a5.6 5.6 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16" r="2" fill="currentColor"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-college" viewBox="0 0 24 24"><path d="m2.5 9.5 9.5-4.5 9.5 4.5-9.5 4.5zM6.5 11.5v4.5c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3v-4.5M21.5 9.5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-rupee" viewBox="0 0 24 24"><path d="M7 4.5h10M7 9h10M7 4.5h3.5a4.5 4.5 0 0 1 0 9H7l8.5 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></symbol>
      <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="planner.js"></script>
  <script src="app.js"></script>
</body>
</html>
